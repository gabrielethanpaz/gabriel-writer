# Login service for the admin page. Deploy from this folder: npx wrangler@4.156.0 deploy
name = "gabriel-cms-login"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
ALLOWED_ORIGINS = "https://gabrielethanpaz.com,https://www.gabrielethanpaz.com"

# Users (SQLite); tables in schema.sql
[[d1_databases]]
binding = "DB"
database_name = "gabriel-cms"
database_id = "675eb7ee-da0c-44bd-aaea-f46ce2f8179f"

# Limits login attempts per IP address
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60
