# Rebuilds index.html and en/index.html when the admin page (/admin/) saves content/*.json,
# then asks GitHub Pages to publish the result.
name: Build site from CMS content

on:
  push:
    branches: [main]
    paths: ['content/**', 'scripts/build-content.mjs']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-content
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build pages from content
        run: node scripts/build-content.mjs

      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then echo "Pages already up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html en/index.html
          git commit -m "Update pages from CMS content"
          for i in 1 2 3 4; do
            if [ "$i" = 4 ]; then echo "Could not push the rebuilt pages"; exit 1; fi
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done
          # pushes made with the workflow token may not start a Pages build on their own
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request failed; the next push will publish"
